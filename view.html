/* Mainfreight tab bar + light-red value fields */

.tab.on{background:rgba(70,130,215,.38)}
.cf{background:var(--mf-red)}
.cf.t{background:var(--mf-red-t);color:#fff}
/* row labels (MON, Week 1, Oct 26, 2026) as light-red see-through fields */

.dn{background:var(--mf-red);border:1px solid var(--edge);border-radius:10px;padding:0 2px;justify-content:center;text-align:center;font-size:11px;white-space:nowrap;overflow:hidden}

function startEdit(e){

function removeEntry(e){const i=entries.indexOf(e);if(i<0)return;entries.splice(i,1);if(e.s){pendingOps.push({sig:sig(e)});savePops()}persist()}
$('cat').onchange=()=>{if($('cat').value==='Truck Repayment'&&$('ex').value==='')$('ex').value=TRUCK.monthly;$('whl').style.display=$('cat').value==='Employee Wages'?'':'none'};
const expNote=()=>{const n=$('note').value.trim(),w=parseFloat($('wh').value)||0;return $('cat').value==='Employee Wages'&&w>0?('PAYG '+w.toFixed(2)+(n?' · '+n:'')):n};

function dupOf(en,skip){if(en.ln)return null;const sk=e=>e===skip||(skip&&typeof skip==='object'&&e.d===skip.d&&e.x===skip.x&&e.del===skip.del&&e.pu===skip.pu&&(e.note||'')===(skip.note||'')&&(e.cat||'')===(skip.cat||''));
  return entries.find(e=>{if(e.ln||sk(e)||e.d!==en.d)return false;
    if(en.x)return !!e.x&&Math.abs(e.x-en.x)<0.005&&(e.cat||'')===(en.cat||'');
    return !e.x&&(en.del||en.pu)&&Math.abs((e.del||0)-en.del)<0.005&&Math.abs((e.pu||0)-en.pu)<0.005})||null}
function dupOk(en,skip){const d=dupOf(en,skip);if(!d)return true;
  const w=en.x?(en.cat||'Expense')+' '+fmt(en.x):'Income '+fmt((en.del||0)+(en.pu||0));
  try{return confirm('Possible duplicate: '+w+' on '+dAU(en.d)+' is already logged. Save it anyway?')}catch(e){return true}}
$('f').onsubmit=ev=>{
  ev.preventDefault();
  const d=$('date').value,nm=$('cm').value==='nm';let en;
  if(fm==='loan'){const a=parseFloat($('lna').value)||0;if(!(a>0)){say('Enter a loan amount.');return}
    en={d,del:0,pu:0,nm:false,ln:$('lnd').value==='out'?-a:a,note:$('lnn').value.trim()}}
  else if(fm==='exp'){const x=parseFloat($('ex').value)||0;if(!(x>0)){say('Enter an expense amount.');return}
    en={d,del:0,pu:0,nm,x,cat:$('cat').value,note:expNote()}}
  else{if($('del').value===''&&$('pu').value===''&&$('oth').value===''){say('Enter deliveries or pickups.');return}
    const o=parseFloat($('oth').value)||0,ok=$('othk').value;
    en={d,del:(parseFloat($('del').value)||0)+(ok==='del'?o:0),pu:(parseFloat($('pu').value)||0)+(ok==='pu'?o:0),nm}}
  if(!dupOk(en,editing))return;
  const was=!!editing;if(editing)removeEntry(editing);
  entries.push(en);persist();
  sel=d;const keepMode=fm;clearForm();setEdit(null);if(!was)setMode(keepMode);say('');
  render();autoSync();
  if(was)showTab('earn');
};

  $('pt').textContent=dt.toLocaleDateString('en-AU',{weekday:'long'})+' '+String(dt.getDate()).padStart(2,'0')+'-'+MN[dt.getMonth()]+'-'+dt.getFullYear();
  const L=entries.filter(e=>e.d===k&&(popKind==='exp'?(e.x||e.ln):(!e.x&&!e.ln)));

let rt='week',rk='inc',rc=new Date(),RP=null;
const FM=['January','February','March','April','May','June','July','August','September','October','November','December'];
const tt=l=>sum(l).reduce((a,b)=>a+b,0);
const dw=l=>new Set(l.filter(e=>!e.x&&!e.ln).map(e=>e.d)).size;
const av=(l,n)=>n?fmt(tt(l)/n):'-';
const hr=l=>av(l,dw(l)*12);
function repBuild(){
  const E=entries.map(e=>Object.assign({e},info(e.d,e.nm)));
  const y=rc.getFullYear(),m=rc.getMonth();
  let t,sub='',list,rows,A=[];
  if(rt==='day'){
    const k=iso(rc),c=info(k);list=entries.filter(e=>e.d===k);
    t=rc.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'short',year:'numeric'});
    const ws=new Date(rc);ws.setDate(rc.getDate()-((rc.getDay()+6)%7));
    rows=[];
    const ml=E.filter(x=>x.ym===c.ym).map(x=>x.e);
    A=[['Month avg per day worked',av(ml,dw(ml))]];
  }else if(rt==='week'){
    const mo=new Date(rc);mo.setDate(rc.getDate()-((rc.getDay()+6)%7));
    const th=new Date(mo);th.setDate(mo.getDate()+3);const su=new Date(mo);su.setDate(mo.getDate()+6);
    const c=info(iso(th));list=E.filter(x=>x.ym===c.ym&&x.w===c.w).map(x=>x.e);
    t='Week '+c.w+', '+MN[su.getMonth()]+' '+su.getFullYear();
    sub=fd(mo)+' - '+fd(su);
    const ks=[];rows=[0,1,2,3,4].map(i=>{const d=new Date(mo);d.setDate(mo.getDate()+i);const k=iso(d);ks.push(k);return[d.toLocaleDateString('en-AU',{weekday:'short'}).toUpperCase()+' '+dm(d),list.filter(e=>e.d===k)]});
    const rest=list.filter(e=>!ks.includes(e.d));if(rest.length)rows.push(['Other days',rest]);
    A=[['Days worked',String(dw(list))],['Avg per day worked',av(list,dw(list))],['Avg per hour (12 hrs/day)',hr(list)]];
  }else if(rt==='month'){
    const k=iso(new Date(y,m,1)).slice(0,7);list=E.filter(x=>x.ym===k).map(x=>x.e);
    t=FM[m]+' '+y;
    rows=[1,2,3,4,5].map(n=>['Week '+n,E.filter(x=>x.ym===k&&x.w===n).map(x=>x.e)]);
    const wn=new Set(E.filter(x=>x.ym===k).map(x=>x.w)).size;
    A=[['Days worked',String(dw(list))],['Avg per day worked',av(list,dw(list))],['Avg per hour (12 hrs/day)',hr(list)],['Avg per week',av(list,wn)]];
  }else if(rt==='quarter'){
    const s=m>=9?9:m>=6?6:m>=3?3:0,q={6:1,9:2,0:3,3:4}[s],fy=s>=6?y+1:y;
    t='Q'+q+' FY'+String(fy).slice(2);sub=MN[s]+' - '+MN[s+2]+' '+y;
    const ks=[0,1,2].map(i=>iso(new Date(y,s+i,1)).slice(0,7));
    const Q=E.filter(x=>ks.includes(x.ym));list=Q.map(x=>x.e);
    rows=ks.map((k,i)=>[MN[s+i]+' '+String(y).slice(2),E.filter(x=>x.ym===k).map(x=>x.e)]);
    const mn=new Set(Q.map(x=>x.ym)).size,wn=new Set(Q.map(x=>x.ym+x.w)).size;
    A=[['Days worked',String(dw(list))],['Avg per day worked',av(list,dw(list))],['Avg per hour (12 hrs/day)',hr(list)],['Avg per week',av(list,wn)],['Avg per month',av(list,mn)]];
  }else{
    const fy=m>=6?y+1:y;t='FY'+String(fy).slice(2);sub='Jul '+(fy-1)+' - Jun '+fy;
    const ks=[];for(let i=0;i<12;i++){const mm=(6+i)%12,yy=i<6?fy-1:fy,k=yy+'-'+String(mm+1).padStart(2,'0');if(k>=BIZ_YM)ks.push([k,MN[mm]+' '+String(yy).slice(2)])}
    const Y=E.filter(x=>x.y===fy);list=Y.map(x=>x.e);
    rows=ks.map(([k,lb])=>[lb,E.filter(x=>x.ym===k).map(x=>x.e)]);
    const mn=new Set(Y.map(x=>x.ym)).size,wn=new Set(Y.map(x=>x.ym+x.w)).size;
    A=[['Days worked',String(dw(list))],['Avg per day worked',av(list,dw(list))],['Avg per hour (12 hrs/day)',hr(list)],['Avg per week',av(list,wn)],['Avg per month',av(list,mn)]];
  }
  const X=rk==='exp',F=X?sumX:sum;
  if(X){const xs=list.filter(e=>e.x),tot=xs.reduce((a,e)=>a+e.x,0),bc={};
    xs.forEach(e=>{const c=e.cat||'Other';bc[c]=(bc[c]||0)+e.x});
    const cs=Object.entries(bc).sort((a,b)=>b[1]-a[1]),top=cs.slice(0,5),rest=cs.slice(5).reduce((a,c)=>a+c[1],0);
    A=[['Entries',String(xs.length)],['Avg per entry',xs.length?fmt(tot/xs.length):'-']].concat(top.map(c=>[c[0],fmt(c[1])]));
    if(rest)A.push(['Other categories',fmt(rest)])}
  const heads=X?XH:IH,v=F(list),tot=v.reduce((a,b)=>a+b,0);
  RP={t,sub,v,heads,tot,A,X,F,rows:rows.map(r=>[r[0],F(r[1])])};
  RP.ex=list.filter(e=>e.x).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  RP.rl=rows.map(r=>r[1]);RP.hd={day:'Day',week:'Day',month:'Week',quarter:'Month',year:'Month'}[rt];
  return RP;
}
function renderRep(){
  const R=repBuild(),P=['week','month','quarter','year'],N=['Week','Month','Quarter','Year'];
  const seg=P.map((p,i)=>`<button type="button" class="seg${p===rt?' on':''}" data-r="${p}">${N[i]}</button>`).join('');
  const av2=R.A.map(a=>`<div class="ar"><span>${a[0]}</span><b>${a[1]}</b></div>`).join('');
  const rkt=`<div class="segs four" id="rkt"><button type="button" class="seg${R.X?'':' on'}" data-k="inc">Income</button><button type="button" class="seg${R.X?' on':''}" data-k="exp">Expenses</button><button type="button" class="seg" data-k="trend">Trend</button><button type="button" class="seg" data-k="find">Find</button><button type="button" class="seg" data-k="custom">Custom</button><button type="button" class="seg" data-k="loans">Loans</button></div>`;
  $('rep').innerHTML=rkt+`<div class="card sec"><div class="segs">${seg}</div>
  <div class="nav"><button type="button" class="nb" data-n="-1">&#8249;</button><div class="nt">${R.t}${R.sub?`<span class="rng">${R.sub}</span>`:''}</div><button type="button" class="nb" data-n="1">&#8250;</button></div></div>
  <div class="card sec"><div class="cols" style="grid-template-columns:repeat(${R.heads.length+1},1fr)">${R.heads.map((h,i)=>`<div class="col"><small>${h}</small><b>${fmt(R.v[i])}</b></div>`).join('')}<div class="col"><small>Total</small><b>${fmt(R.tot)}</b></div></div></div>
  <div class="card sec"><div class="arl${R.X?' sx':''}">${av2}</div></div>
  ${R.rows.length?`<details class="bk"><summary class="card sec">Breakdown</summary>${table(R.hd,R.rows.map((r,i)=>row(r[0],R.rl[i],null,R.F)).join(''),rt==='month'?'sc w':rt==='year'?'sc m':'',R.heads)}</details>`:''}
  <div class="dl2"><button class="save${R.X?'':' inc'}" type="button" id="pdfb">Download PDF</button><button class="save${R.X?' alt':' inc'}" type="button" id="csvb">Download CSV</button></div>`;
  fit();
}

async function shareFile(f,nm){
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:nm});return}}catch(e){if(e&&e.name==='AbortError')return}
  const u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=nm;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500);
}
function mkCsv(){
  const q=v=>{v=String(v==null?'':v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const H=['Date','Day','Type','Category','Note','Deliveries','Pickups','Income total','Expense','Director loan (+in / -out)','Mainfreight month','Week of month','Financial year','Synced to Google Sheets'];
  const L=entries.slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0).map(e=>{const i=info(e.d,e.nm),de=e.a!==undefined?e.a:(e.del||0),pu=e.pu||0;
    const ld=!!e.ln;return [e.d,dayName(e.d),ld?'Director loan':e.x?'Expense':'Income',e.x?(e.cat||''):'',(e.x||ld)?(e.note||''):'',(e.x||ld)?'':de.toFixed(2),(e.x||ld)?'':pu.toFixed(2),(e.x||ld)?'':(de+pu).toFixed(2),e.x?e.x.toFixed(2):'',ld?e.ln.toFixed(2):'',i.ym,i.w,'FY'+String(i.y).slice(2),e.s?'Yes':'No']});
  const csv='\ufeff'+[H].concat(L).map(r=>r.map(q).join(',')).join('\r\n');
  const nm='BMP-Cashflow-'+iso(new Date())+'.csv';
  shareFile(new File([csv],nm,{type:'text/csv'}),nm);
}

function lhDraw(d){try{d.addImage(LH_IMG,'JPEG',0,0,210,297)}catch(e){}d.setTextColor(0,0,0);d.setDrawColor(0,0,0);d.setLineWidth(.2)}
function lhFoot(d){const n=d.getNumberOfPages();if(n>1)for(let i=1;i<=n;i++){d.setPage(i);d.setFont('helvetica','normal');d.setFontSize(8);d.setTextColor(110,110,110);d.text('Page '+i+' of '+n,195,275.8,{align:'right'})}d.setTextColor(0,0,0);d.setDrawColor(0,0,0)}

/* ===== shared PDF table helpers ===== */
const PG_=[0,140,60],PR_=[200,0,30],PK_=[0,0,0];
function pdfTitle(d,y,t,sub){d.setFont('helvetica','bold');d.setFontSize(18);d.setTextColor(0,0,0);d.text(t,15,y);y+=7;d.setFont('helvetica','normal');d.setFontSize(10);d.setTextColor(90,90,90);(Array.isArray(sub)?sub:[sub]).filter(Boolean).forEach(x=>{d.text(x,15,y);y+=5});d.setTextColor(0,0,0);d.setDrawColor(200,200,200);d.line(15,y,195,y);d.setDrawColor(0,0,0);return y+7}
function pdfSec(d,y,t){if(y>255){d.addPage();lhDraw(d);y=60}d.setFont('helvetica','bold');d.setFontSize(12);d.setTextColor(0,0,0);d.text(t,15,y);return y+6}
function pdfTbl(d,y,cols,rows,o){o=o||{};const sz=o.sz||9.5,lh=sz*0.5+0.4;
  const head=yy=>{d.setFillColor(228,235,248);d.rect(15,yy-4.6,180,6.6,'F');d.setFont('helvetica','bold');d.setFontSize(9);d.setTextColor(25,45,95);cols.forEach(c=>d.text(c.t,c.x,yy,{align:c.al||'left'}));d.setTextColor(0,0,0);return yy+6.4};
  y=head(y);
  rows.forEach((r,i)=>{const cells=r.map(c=>typeof c==='object'&&c!==null?c:{t:String(c)});
    const bold=r.b||o.bold;d.setFont('helvetica',bold?'bold':'normal');d.setFontSize(sz);
    const L=cells.map((c,k)=>cols[k].w?d.splitTextToSize(String(c.t),cols[k].w):[String(c.t)]);
    const n=Math.max(1,...L.map(a=>a.length)),h=lh*n+1.4;
    if(y+h>270){d.addPage();lhDraw(d);y=60;y=head(y)}
    if(r.b){d.setFillColor(238,241,247);d.rect(15,y-4.2,180,h,'F')}else if(i%2){d.setFillColor(248,249,252);d.rect(15,y-4.2,180,h,'F')}
    d.setFont('helvetica',bold?'bold':'normal');d.setFontSize(sz);
    cells.forEach((c,k)=>{const col=c.c||PK_;d.setTextColor(col[0],col[1],col[2]);d.text(L[k],cols[k].x,y,{align:cols[k].al||'left'})});
    d.setTextColor(0,0,0);y+=h});
  d.setDrawColor(200,200,200);d.line(15,y-3.2,195,y-3.2);d.setDrawColor(0,0,0);return y+3}
const pdfDt=x=>x?new Date(x+'T00:00').toLocaleDateString('en-AU',{weekday:'short',day:'2-digit',month:'short',year:'2-digit'}):'';
async function mkPdf(){
  const J=window.jspdf;if(!J){alert('PDF tool is still loading. Check your internet and try again.');return}
  const R=RP,d=new J.jsPDF({unit:'mm',format:'a4'});let y=60;lhDraw(d);
  const X=!!R.X,sg=(v,neg)=>({t:(neg?'-':'+')+fmt(Math.abs(v)),c:neg?PR_:PG_}),mt=(v,neg)=>v?{t:(neg?'-':'')+fmt(Math.abs(v)),c:neg?PR_:PG_}:'-';
  y=pdfTitle(d,y,X?'BMP Expenses Report':'BMP Earnings Report',[rt[0].toUpperCase()+rt.slice(1)+': '+R.t+(R.sub?'   ('+R.sub+')':''),'Generated '+new Date().toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})]);
  y=pdfSec(d,y,'Summary');
  const sr=R.heads.map((h,i)=>[h,mt(R.v[i],X)]);const tr=['Total',mt(R.tot,X)];tr.b=1;sr.push(tr);R.A.forEach(a=>sr.push([a[0],a[1]]));
  y=pdfTbl(d,y,[{t:'Item',x:17},{t:'Amount',x:193,al:'right'}],sr);y+=3;
  if(R.rows.length){const n=R.heads.length,xs=n===3?[110,140,168]:[130,160];
    y=pdfSec(d,y,'Breakdown by '+R.hd.toLowerCase());
    const cols=[{t:R.hd,x:17}].concat(R.heads.map((h,i)=>({t:h,x:xs[i],al:'right'}))).concat([{t:'Total',x:193,al:'right'}]);
    const rows=R.rows.map(r=>[r[0]].concat(r[1].map(v=>v?mt(v,X):'-')).concat([mt(r[1].reduce((a,b)=>a+b,0),X)]));
    y=pdfTbl(d,y,cols,rows);y+=3}
  const L=[].concat(...(R.rl||[])).filter((e,i,a)=>a.indexOf(e)===i).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  if(X){const rows=[];let tot=0,lt=0;L.forEach(e=>{if(e.x){tot+=e.x;rows.push([pdfDt(e.d),(e.cat||'Expense')+(e.note?' - '+e.note:''),sg(e.x,true)])}else if(e.ln>0){lt+=e.ln;rows.push([pdfDt(e.d),'Director loan'+(e.note?' - '+e.note:''),sg(e.ln,false)])}});

/* ===== Invoices from email: the Google script lists them on the "Inbox" tab, you confirm them here ===== */
let INBX=[];
const ibSig=x=>x.d+'|'+r2(x.del)+'|'+r2(x.pu);
const ibDone=()=>{try{return JSON.parse(localStorage.getItem('ibd')||'{}')}catch(e){return{}}};
const ibSave=o=>{try{localStorage.setItem('ibd',JSON.stringify(o))}catch(e){}};
async function ibMark(x,status){
  const r=await mcp.callTool('Google Sheets','get_values',{spreadsheetId:SID,range:'Inbox!A2:H500'});
  const v=(r.payload&&r.payload.values)||[];
  const i=v.findIndex(q=>String(q[0])===x.d&&/^(new|check)$/i.test(String(q[3]||''))&&r2(num(q[1]))===r2(x.del)&&r2(num(q[2]))===r2(x.pu));
  if(i<0)return true;
  await mcp.callTool('Google Sheets','update_values',{spreadsheetId:SID,range:'Inbox!D'+(i+2),values:[[status]]});
  return true}
let ibBusy=false;
async function loadInbox(){
  if(window.BMP_VIEW||ibBusy)return;
  if(!(tok&&Date.now()<tokExp))return;
  ibBusy=true;
  try{
    const r=await mcp.callTool('Google Sheets','get_values',{spreadsheetId:SID,range:'Inbox!A2:H500'});
    const all=((r.payload&&r.payload.values)||[]).map(v=>({d:String(v[0]||''),del:num(v[1]),pu:num(v[2]),st:String(v[3]||'').toLowerCase(),dn:v[5]||'',pn:v[6]||'',note:String(v[7]||'')}))
      .filter(x=>/^\d{4}-\d\d-\d\d$/.test(x.d)&&(x.st==='new'||x.st==='check'));
    const dn=ibDone();INBX=[];
    for(const x of all){const k=ibSig(x);if(dn[k]){try{await ibMark(x,dn[k])}catch(e){}}else INBX.push(x)}
  }catch(e){INBX=[]}
  finally{ibBusy=false}
  paintInbox()}
function mBadge(){const eb=$('ebdg');if(!eb)return;const n=window.BMP_VIEW?0:(typeof blSoonCount==='function'?blSoonCount():0);eb.textContent=n||'';eb.style.display=n?'inline-block':'none';try{homeBadge()}catch(e){}}
function paintInbox(){
  const old=$('inbx');if(old)old.remove();
  mBadge();
  if(window.BMP_VIEW||!INBX.length)return;
  const cft=$('hinbx');if(!cft)return;
  const has=x=>entries.filter(e=>e.d===x.d&&!e.x&&!e.ln).reduce((a,e)=>a+amt(e),0);
  const lab=d=>new Date(d+'T00:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
  const clean=INBX.every(x=>x.st==='new'&&!has(x));
  const rows=INBX.map((x,i)=>{const h=has(x),w=x.st==='check'?'Does not add up. Check the PDF before adding.':(h>0?'You already entered '+fmt(h)+' for this day.':'');
    return `<div class="ibr"><div class="ibd"><b>${lab(x.d)}</b><br>Deliveries <b>${fmt(x.del)}</b>${x.dn?' ('+esc(x.dn)+')':''}<br>Pickups <b>${fmt(x.pu)}</b>${x.pn?' ('+esc(x.pn)+')':''}${w?`<span class="ibw">${esc(w)}</span>`:''}</div><div class="ibb"><button type="button" class="go" data-ib="add" data-i="${i}">${w?'Add anyway':'Add'}</button><button type="button" data-ib="skip" data-i="${i}">Skip</button></div></div>`}).join('');
  const el=document.createElement('div');el.className='card tl inbx';el.id='inbx';
  el.innerHTML=`<div class="pfh">${INBX.length} new</div>${rows}${INBX.length>1&&clean?'<button type="button" class="iba" data-ib="all">Add all '+INBX.length+'</button>':''}`;
  cft.after(el)}
async function ibAct(i,act){
  const x=INBX[i];if(!x)return;
  const st=act==='add'?'added':'skipped',dn=ibDone();dn[ibSig(x)]=st;ibSave(dn);
  if(act==='add'){entries.push({d:x.d,del:x.del,pu:x.pu,nm:false});persist();autoSync()}

document.addEventListener('click',ev=>{const b=ev.target.closest&&ev.target.closest('[data-ib]');if(!b)return;
  if(b.dataset.ib==='all'){const L=INBX.slice();(async()=>{for(const x of L){const i=INBX.indexOf(x);if(i>=0)await ibAct(i,'add')}})()}
  else ibAct(+b.dataset.i,b.dataset.ib)});
(function(){const _r=render;render=function(){const r=_r.apply(this,arguments);try{paintInbox()}catch(e){}return r};

function billsHtml(){

async function blWrite(key,due,st,nt){
